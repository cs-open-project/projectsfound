version: '1.0'
name: master-pipeline
displayName: MasterPipeline
stages:
  - stage: 
    name: compile
    displayName: 编译
    steps:
      - step: build@python
        name: build_python
        displayName: Python 构建
        pythonVersion: '3.9'
        # 非必填字段，开启后表示将构建产物暂存，但不会上传到制品库中，7天后自动清除
        artifacts:
            # 构建产物名字，作为产物的唯一标识可向下传递，支持自定义，默认为BUILD_ARTIFACT。在下游可以通过${BUILD_ARTIFACT}方式引用来获取构建物地址
          - name: BUILD_ARTIFACT
            # 构建产物获取路径，是指代码编译完毕之后构建物的所在路径
            path:
              - ./
        commands:
#          - python3 -m pip install --upgrade pip
#          - pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
#          - pip3 install -r requirements.txt
          - python3 ./main.py > release.txt
          - git config --global user.email "923463801@qq.com"
          - git config --global user.name "xliuqq"
          - git add README.md CHANGELOG_PROJECTS.md
          - git commit -F release.txt
          - if [ "$?" == "0" ] ; then git push https://923463801%40qq.com:${TOKEN}@gitee.com/cs-open-project/projectsfound.git master ; fi

triggers:
  push:
    branches:
      include:
        - master